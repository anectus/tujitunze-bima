services:
  db:
    image: postgres:16-alpine
    container_name: tujitunze-core-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in tujitunze_core/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in tujitunze_core/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in tujitunze_core/.env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tujitunze-core-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in tujitunze_core/.env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in tujitunze_core/.env}
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in tujitunze_core/.env}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"

volumes:
  core-postgres-data:
